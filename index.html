<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNKI RefWorks 批量分析</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%); font-family: system-ui, -apple-system, sans-serif; padding: 2rem 1rem; min-height: 100vh; display: flex; justify-content: center; }
  .card { max-width: 1100px; width: 100%; background: rgba(255, 255, 255, 0.92); border-radius: 2.5rem; box-shadow: 0 30px 50px -20px rgba(0, 30, 60, 0.25); padding: 2.2rem; border: 1px solid #fff; }
  h1 { font-size: 1.8rem; color: #0b2b44; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
  .subhead { color: #3a5e7a; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px dashed #cbdbe9; display: flex; justify-content: space-between; }
  .upload-area { background: #ffffffd9; border: 2px dashed #aac7e0; border-radius: 1.5rem; padding: 1.5rem; text-align: center; cursor: pointer; margin-bottom: 1.5rem; transition: 0.2s; }
  .upload-area:hover, .upload-area.drag-over { background: #f4faff; border-color: #5d9bce; }
  .upload-icon { font-size: 2.5rem; margin-bottom: 0.5rem; display: block; }
  .file-input { display: none; }
  .file-chip { background: #d9e9f8; padding: 0.2rem 0.8rem; border-radius: 20px; font-size: 0.8rem; color: #184a6e; display: inline-flex; margin: 0.2rem; }
  .file-chip span { cursor: pointer; margin-left: 0.5rem; color: #b13e3e; font-weight: bold; }
  .summary-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
  .summary-item { background: #fff; border-radius: 1rem; padding: 1rem; box-shadow: 0 8px 20px -12px rgba(0, 40, 70, 0.2); border: 1px solid #dbe9f5; }
  .summary-item .label { font-size: 0.8rem; color: #5f7f9a; margin-bottom: 0.3rem; }
  .summary-item .value { font-size: 1.5rem; font-weight: 700; color: #0b3d60; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
  .stat-panel, .chart-panel { background: #fff; border-radius: 1.5rem; padding: 1.2rem; box-shadow: 0 12px 22px -12px rgba(0, 40, 70, 0.15); border: 1px solid #d3e5f2; }
  .panel-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; border-bottom: 1px solid #cde0ee; padding-bottom: 0.5rem; flex-wrap: wrap; }
  .panel-header h2 { font-size: 1.1rem; color: #0d3a5a; }
  .panel-actions { margin-left: auto; display: flex; gap: 0.3rem; flex-wrap: wrap; }
  .mini-btn { background: #edf5fc; border: 1px solid #c6dced; color: #1d4e74; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; cursor: pointer; }
  .mini-btn.active { background: #2b7aac; color: #fff; border-color: #2b7aac; }
  .list-container { max-height: 300px; overflow-y: auto; padding-right: 0.5rem; }
  .stat-item { display: grid; grid-template-columns: 1fr auto 80px; align-items: center; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid #edf4fa; font-size: 0.9rem; }
  .stat-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #12426b; font-weight: 500; }
  .stat-value { background: #e2eefb; color: #0d314b; padding: 0.1rem 0.5rem; border-radius: 20px; font-weight: 700; font-size: 0.8rem; }
  .stat-bar-wrap { background: #eef5fb; border-radius: 10px; height: 8px; overflow: hidden; }
  .stat-bar { height: 100%; background: linear-gradient(90deg, #79b8e0, #2b7aac); }
  .empty-message { color: #809aae; text-align: center; padding: 2rem; font-style: italic; }
  .chart-container { width: 100%; height: 350px; position: relative; display: flex; justify-content: center; align-items: center; }
  .error-message { color: #b13e3e; background: #ffe9e9; padding: 1rem; border-radius: 1rem; margin-top: 1rem; display: none; }
  .footer-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; }
  .btn-primary, .reset-btn { padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-weight: 500; border: none; }
  .btn-primary { background: #2b7aac; color: #fff; }
  .btn-primary:disabled { background: #b3c8d8; cursor: not-allowed; }
  .reset-btn { background: none; border: 1px solid #b8d0e5; color: #295e84; }
  @media (max-width: 720px) { .stats-grid, .summary-bar { grid-template-columns: 1fr; } .card { padding: 1.5rem; } }
</style>
</head>
<body>
<div class="card">
  <h1>📊 CNKI RefWorks 批量分析</h1>
  <div class="subhead">
    <span>按年份统计发文量 · 按刊源统计文章数</span>
    <span style="font-size: 0.8rem; background: #d9e6f2; padding: 0.2rem 0.8rem; border-radius: 20px;">支持多选 .txt 及 SVG 导出</span>
  </div>

  <div class="upload-area" id="uploadArea">
    <span class="upload-icon">📤</span>
    <div>点击或拖拽多个文件到此处</div>
    <div style="font-size: 0.8rem; color: #6f8da3;">支持 CNKI RefWorks 导出的纯文本文件 (.txt)</div>
    <div id="fileChipsContainer"></div>
    <input type="file" id="fileInput" class="file-input" accept=".txt,text/plain" multiple>
  </div>

  <div class="summary-bar">
    <div class="summary-item"><div class="label">已解析文件</div><div class="value" id="sumFiles">0</div></div>
    <div class="summary-item"><div class="label">总文章数</div><div class="value" id="sumArticles">0</div></div>
    <div class="summary-item"><div class="label">年份种类</div><div class="value" id="sumYears">0</div></div>
    <div class="summary-item"><div class="label">期刊种类</div><div class="value" id="sumSources">0</div></div>
  </div>

  <div class="stats-grid">
    <div class="stat-panel">
      <div class="panel-header">
        <h2>📅 发刊时间</h2>
        <span id="yearCount" style="font-size:0.8rem;color:#5f7f9a;">0 个年份</span>
        <div class="panel-actions">
          <button class="mini-btn active" id="yearSortDesc">新→旧</button>
          <button class="mini-btn" id="yearSortAsc">旧→新</button>
        </div>
      </div>
      <div class="list-container" id="yearList"><div class="empty-message">暂无数据</div></div>
    </div>
    <div class="stat-panel">
      <div class="panel-header">
        <h2>📚 发文刊源</h2>
        <span id="sourceCount" style="font-size:0.8rem;color:#5f7f9a;">0 个刊源</span>
        <div class="panel-actions">
          <button class="mini-btn active" id="sourceSortCount">按数量</button>
          <button class="mini-btn" id="sourceSortName">按名称</button>
        </div>
      </div>
      <div class="list-container" id="sourceList"><div class="empty-message">暂无数据</div></div>
    </div>
  </div>

  <div class="chart-panel">
    <div class="panel-header">
      <h2>📈 可视化图表 (纯矢量)</h2>
      <div class="panel-actions">
        <button class="mini-btn active" id="chartDataYear">年份分布</button>
        <button class="mini-btn" id="chartDataSource">期刊分布</button>
        <span style="border-left: 1px solid #cde0ee; margin: 0 0.3rem;"></span>
        <button class="mini-btn active" id="chartTypeBar">柱状图</button>
        <button class="mini-btn" id="chartTypeLine">折线图</button>
        <button class="mini-btn" id="chartTypePie">饼图</button>
        <span style="border-left: 1px solid #cde0ee; margin: 0 0.3rem;"></span>
        <button class="mini-btn" id="exportSvgBtn" style="background:#e2eefb; color:#2b7aac; font-weight:bold;">⬇️ 导出 SVG</button>
      </div>
    </div>
    <div class="chart-container" id="chartContainer">
      <div class="empty-message">暂无数据</div>
    </div>
  </div>

  <div id="errorBox" class="error-message"></div>

  <div class="footer-bar">
    <div id="fileInfoBar" style="font-size:0.85rem;color:#4f728b;"></div>
    <div style="display:flex;gap:0.5rem;">
      <button class="btn-primary" id="exportCsvBtn" disabled>导出 CSV</button>
      <button class="reset-btn" id="resetBtn">清空</button>
    </div>
  </div>
</div>

<script>
(function() {
  let currentFiles = [];
  let stats = { years: new Map(), sources: new Map(), articleCount: 0 };
  let yearSortMode = 'desc', sourceSortMode = 'count';
  let chartDataMode = 'year', chartTypeMode = 'bar';

  const $ = id => document.getElementById(id);
  const escapeHtml = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // ---------- 解析逻辑 ----------
  function parseRefWorks(text) {
    const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
    let current = null, years = new Map(), sources = new Map(), count = 0;
    for (let raw of lines) {
      let line = raw.trim(); if (!line) continue;
      let upper = line.toUpperCase();
      if (upper.startsWith('RT ')) { current = { year: null, source: null }; count++; continue; }
      if (!current && (upper.startsWith('JF ') || upper.startsWith('YR ') || upper.startsWith('A1 '))) { current = { year: null, source: null }; count++; }
      if (!current) continue;
      let m = line.match(/^([A-Z][A-Z0-9])\s+(.*)$/i) || line.match(/^([A-Z][A-Z0-9]):\s*(.*)$/i);
      if (!m) continue;
      let tag = m[1].toUpperCase(), val = m[2].trim(); if (!val) continue;
      if (['JF','JO','T2','JA'].includes(tag) && !current.source) current.source = val;
      if (['YR','PY'].includes(tag) && !current.year) { let ym = val.match(/\b(19|20)\d{2}\b/); if(ym) current.year = ym[0]; }
      if (tag === 'LK' && !current.year) { let ym = val.match(/(19|20)\d{2}/); if(ym) current.year = ym[0]; }
    }
    // 重新遍历收集（修复之前断点的问题）
    // 这里的逻辑改为：只要解析到了就累加
    const records = [];
    let c2 = null;
    for (let raw of lines) {
      let line = raw.trim(); if (!line) continue;
      if (line.toUpperCase().startsWith('RT ')) { if(c2) records.push(c2); c2 = { year: null, source: null }; continue; }
      if (!c2) c2 = { year: null, source: null };
      let m = line.match(/^([A-Z][A-Z0-9])\s+(.*)$/i) || line.match(/^([A-Z][A-Z0-9]):\s*(.*)$/i);
      if (m) {
        let tag = m[1].toUpperCase(), val = m[2].trim();
        if (['JF','JO','T2','JA'].includes(tag) && !c2.source) c2.source = val;
        if (['YR','PY'].includes(tag) && !c2.year) { let ym = val.match(/\b(19|20)\d{2}\b/); if(ym) c2.year = ym[0]; }
        if (tag === 'LK' && !c2.year) { let ym = val.match(/(19|20)\d{2}/); if(ym) c2.year = ym[0]; }
      }
    }
    if (c2) records.push(c2);
    
    let cnt = 0;
    for (let r of records) {
      if (r.year) years.set(r.year, (years.get(r.year)||0)+1);
      if (r.source) sources.set(r.source, (sources.get(r.source)||0)+1);
      if (r.year || r.source) cnt++;
    }
    return { years, sources, count: cnt };
  }

  // ---------- 渲染列表 ----------
  function renderLists() {
    $('sumFiles').innerText = currentFiles.length;
    $('sumArticles').innerText = stats.articleCount;
    $('sumYears').innerText = stats.years.size;
    $('sumSources').innerText = stats.sources.size;
    $('fileInfoBar').innerText = currentFiles.length ? `已加载 ${currentFiles.length} 个文件，共 ${stats.articleCount} 条记录` : '';
    $('exportCsvBtn').disabled = (stats.years.size === 0 && stats.sources.size === 0);

    let ye = Array.from(stats.years.entries());
    $('yearCount').innerText = `${ye.length} 个年份`;
    if (ye.length) {
      ye.sort((a,b) => yearSortMode==='desc' ? b[0].localeCompare(a[0]) : a[0].localeCompare(b[0]));
      let max = Math.max(...ye.map(x=>x[1]));
      $('yearList').innerHTML = ye.map(([y,c]) => `
        <div class="stat-item">
          <span class="stat-label">${escapeHtml(y)} 年</span>
          <span class="stat-value">${c} 篇</span>
          <div class="stat-bar-wrap"><div class="stat-bar" style="width:${(c/max*100)}%"></div></div>
        </div>`).join('');
    } else { $('yearList').innerHTML = '<div class="empty-message">暂无数据</div>'; }

    let se = Array.from(stats.sources.entries());
    $('sourceCount').innerText = `${se.length} 个刊源`;
    if (se.length) {
      se.sort((a,b) => sourceSortMode==='count' ? (b[1]-a[1] || a[0].localeCompare(b[0])) : a[0].localeCompare(b[0]));
      let max = Math.max(...se.map(x=>x[1]));
      $('sourceList').innerHTML = se.map(([s,c]) => `
        <div class="stat-item">
          <span class="stat-label" title="${escapeHtml(s)}">${escapeHtml(s)}</span>
          <span class="stat-value">${c} 篇</span>
          <div class="stat-bar-wrap"><div class="stat-bar" style="width:${(c/max*100)}%"></div></div>
        </div>`).join('');
    } else { $('sourceList').innerHTML = '<div class="empty-message">暂无数据</div>'; }
  }

  // ---------- 纯 SVG 渲染图表 ----------
  function renderChart() {
    let entries = chartDataMode === 'year' ? Array.from(stats.years.entries()) : Array.from(stats.sources.entries());
    if (chartDataMode === 'year') entries.sort((a,b)=>a[0].localeCompare(b[0]));
    else { entries.sort((a,b)=>b[1]-a[1]); entries = entries.slice(0, 15); } // 期刊最多显示前15

    const container = $('chartContainer');
    if (!entries.length) { container.innerHTML = '<div class="empty-message">暂无数据</div>'; return; }

    const w = 800, h = 350, pad = 40;
    let svg = `<svg id="mySvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;">`;
    svg += `<style>.t{font-family:sans-serif;font-size:12px;fill:#333;} .v{font-weight:bold;font-size:12px;fill:#0b3d60;text-anchor:middle;}</style>`;
    
    const colors = ['#2b7aac', '#79b8e0', '#4fa0d0', '#1f6690', '#a0cbf0', '#559dc7', '#89c1e8', '#398ab5', '#13476a', '#65a9d8'];

    if (chartTypeMode === 'bar' || chartTypeMode === 'line') {
      let max = Math.max(...entries.map(x=>x[1]));
      let cw = (w - pad*2) / entries.length;
      // 绘制坐标轴
      svg += `<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#ccc"/>`;
      svg += `<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="#ccc"/>`;
      
      let points = [];
      entries.forEach(([label, val], i) => {
        let bh = (val / max) * (h - pad * 2);
        let x = pad + i * cw + cw/2;
        let y = h - pad - bh;
        
        // X 轴标签
        let shortLabel = label.length > 6 ? label.slice(0,6)+'…' : label;
        svg += `<text x="${x}" y="${h-pad+15}" class="t" text-anchor="middle">${escapeHtml(shortLabel)}</text>`;
        
        if (chartTypeMode === 'bar') {
          svg += `<rect x="${x - cw*0.3}" y="${y}" width="${cw*0.6}" height="${bh}" fill="${colors[i%colors.length]}" rx="4"/>`;
          svg += `<text x="${x}" y="${y-5}" class="v">${val}</text>`;
        } else {
          points.push(`${x},${y}`);
          svg += `<circle cx="${x}" cy="${y}" r="4" fill="#2b7aac"/>`;
          svg += `<text x="${x}" y="${y-10}" class="v">${val}</text>`;
        }
      });
      if (chartTypeMode === 'line') {
        svg += `<polyline points="${points.join(' ')}" fill="none" stroke="#2b7aac" stroke-width="2"/>`;
      }
    } else if (chartTypeMode === 'pie') {
      let total = entries.reduce((s,x)=>s+x[1], 0);
      let start = 0, cx = w/2, cy = h/2, r = 120;
      entries.forEach(([label, val], i) => {
        let angle = (val / total) * Math.PI * 2;
        let end = start + angle;
        let x1 = cx + r * Math.sin(start), y1 = cy - r * Math.cos(start);
        let x2 = cx + r * Math.sin(end), y2 = cy - r * Math.cos(end);
        let large = angle > Math.PI ? 1 : 0;
        
        if (entries.length === 1) {
          svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${colors[i%colors.length]}"/>`;
        } else {
          svg += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${colors[i%colors.length]}" stroke="#fff" stroke-width="2"/>`;
        }
        
        // 图例 (右侧)
        let ly = 40 + i * 20;
        if (ly < h - 20) {
          svg += `<rect x="${w-180}" y="${ly-10}" width="12" height="12" fill="${colors[i%colors.length]}" rx="2"/>`;
          let shortLabel = label.length > 12 ? label.slice(0,12)+'…' : label;
          svg += `<text x="${w-160}" y="${ly}" class="t">${escapeHtml(shortLabel)} (${val})</text>`;
        }
        start = end;
      });
    }
    svg += `</svg>`;
    container.innerHTML = svg;
  }

  // ---------- 核心分析 ----------
  function analyzeFiles(files) {
    let tY = new Map(), tS = new Map(), tA = 0;
    let promises = files.map(f => new Promise(res => {
      if (!f.name.toLowerCase().endsWith('.txt')) return res();
      let r = new FileReader();
      r.onload = e => {
        let { years, sources, count } = parseRefWorks(e.target.result);
        years.forEach((c,y) => tY.set(y, (tY.get(y)||0)+c));
        sources.forEach((c,s) => tS.set(s, (tS.get(s)||0)+c));
        tA += count; res();
      };
      r.readAsText(f, 'UTF-8');
    }));
    Promise.all(promises).then(() => {
      stats = { years: tY, sources: tS, articleCount: tA };
      renderLists(); renderChart();
    });
  }

  // ---------- 事件绑定 ----------
  $('uploadArea').onclick = e => { if(!e.target.classList.contains('remove-file')) $('fileInput').click(); };
  $('fileInput').onchange = e => {
    let files = Array.from(e.target.files).filter(f => f.name.toLowerCase().endsWith('.txt'));
    if (files.length) {
      currentFiles = currentFiles.concat(files);
      let html = currentFiles.slice(0,5).map((f,i)=>`<span class="file-chip">${escapeHtml(f.name.slice(0,15))}... <span class="remove-file" data-i="${i}">×</span></span>`).join('');
      if (currentFiles.length > 5) html += `<span class="file-chip">+${currentFiles.length-5}个</span>`;
      $('fileChipsContainer').innerHTML = html;
      analyzeFiles(currentFiles);
    }
    $('fileInput').value = '';
  };
  $('fileChipsContainer').onclick = e => {
    if (e.target.classList.contains('remove-file')) {
      currentFiles.splice(parseInt(e.target.dataset.i), 1);
      $('fileChipsContainer').innerHTML = ''; // 重置界面
      $('fileInput').onchange({ target: { files: [] } }); // 触发重新渲染逻辑
      if(currentFiles.length === 0) { stats = { years: new Map(), sources: new Map(), articleCount: 0 }; renderLists(); renderChart(); }
      else analyzeFiles(currentFiles);
    }
  };

  $('yearSortDesc').onclick = () => { yearSortMode='desc'; $('yearSortDesc').classList.add('active'); $('yearSortAsc').classList.remove('active'); renderLists(); };
  $('yearSortAsc').onclick = () => { yearSortMode='asc'; $('yearSortAsc').classList.add('active'); $('yearSortDesc').classList.remove('active'); renderLists(); };
  $('sourceSortCount').onclick = () => { sourceSortMode='count'; $('sourceSortCount').classList.add('active'); $('sourceSortName').classList.remove('active'); renderLists(); };
  $('sourceSortName').onclick = () => { sourceSortMode='name'; $('sourceSortName').classList.add('active'); $('sourceSortCount').classList.remove('active'); renderLists(); };

  $('chartDataYear').onclick = () => { chartDataMode='year'; $('chartDataYear').classList.add('active'); $('chartDataSource').classList.remove('active'); renderChart(); };
  $('chartDataSource').onclick = () => { chartDataMode='source'; $('chartDataSource').classList.add('active'); $('chartDataYear').classList.remove('active'); renderChart(); };
  $('chartTypeBar').onclick = () => { chartTypeMode='bar'; $('chartTypeBar').classList.add('active'); $('chartTypeLine').classList.remove('active'); $('chartTypePie').classList.remove('active'); renderChart(); };
  $('chartTypeLine').onclick = () => { chartTypeMode='line'; $('chartTypeLine').classList.add('active'); $('chartTypeBar').classList.remove('active'); $('chartTypePie').classList.remove('active'); renderChart(); };
  $('chartTypePie').onclick = () => { chartTypeMode='pie'; $('chartTypePie').classList.add('active'); $('chartTypeBar').classList.remove('active'); $('chartTypeLine').classList.remove('active'); renderChart(); };

  $('exportSvgBtn').onclick = () => {
    let svg = document.getElementById('mySvg');
    if (!svg) return alert('暂无图表可导出');
    let svgStr = new XMLSerializer().serializeToString(svg);
    let blob = new Blob([svgStr], {type: "image/svg+xml;charset=utf-8"});
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url; a.download = `CNKI图表_${chartDataMode}_${chartTypeMode}.svg`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };

  $('exportCsvBtn').onclick = () => {
    let lines = ['类型,名称,数量'];
    stats.years.forEach((c,y) => lines.push(`年份,${y},${c}`));
    stats.sources.forEach((c,s) => lines.push(`刊源,"${s.replace(/"/g,'""')}",${c}`));
    let csv = '\uFEFF' + lines.join('\r\n');
    let blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a'); a.href = url; a.download = 'CNKI统计.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };

  $('resetBtn').onclick = () => { currentFiles = []; $('fileChipsContainer').innerHTML = ''; stats = { years: new Map(), sources: new Map(), articleCount: 0 }; renderLists(); renderChart(); };

  renderLists(); renderChart();
})();
</script>
</body>
</html>
