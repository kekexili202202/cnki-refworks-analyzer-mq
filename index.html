<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNKI RefWorks 批量分析 · 年份与刊源统计</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%); font-family: system-ui, -apple-system, sans-serif; padding: 2rem 1rem; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
  .card { max-width: 1150px; width: 100%; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); border-radius: 2.5rem; box-shadow: 0 30px 50px -20px rgba(0, 30, 60, 0.25); padding: 2.2rem 2rem 2.5rem; border: 1px solid rgba(255, 255, 255, 0.5); }
  h1 { font-size: 2rem; font-weight: 600; color: #0b2b44; display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.25rem; }
  .subhead { color: #3a5e7a; font-size: 1rem; margin-bottom: 1.6rem; padding-bottom: 0.75rem; border-bottom: 1.5px dashed #cbdbe9; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 0.75rem; }
  .subhead .hint { background: #d9e6f2; padding: 0.2rem 0.9rem; border-radius: 40px; font-size: 0.8rem; color: #1d4b6e; font-weight: 500; }

  /* 原始上传区样式 */
  .upload-area { background: #ffffffd9; border: 2px dashed #aac7e0; border-radius: 2rem; padding: 2rem 1.5rem; text-align: center; cursor: pointer; transition: all 0.2s ease; margin-bottom: 1.4rem; box-shadow: 0 6px 12px -8px rgba(0, 50, 80, 0.1); }
  .upload-area:hover { background: #f4faff; border-color: #5d9bce; }
  .upload-area.drag-over { background: #e2effa; border-color: #2b7aac; transform: scale(1.01); }
  .upload-icon { font-size: 2.8rem; margin-bottom: 0.6rem; display: block; }
  .upload-text { font-weight: 500; color: #1f4a6e; font-size: 1.05rem; margin-bottom: 0.3rem; }
  .upload-subtext { color: #6f8da3; font-size: 0.85rem; }
  .file-input { display: none; }
  .file-list { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 0.8rem; }
  .file-chip { background: #d9e9f8; padding: 0.25rem 0.9rem; border-radius: 30px; font-size: 0.8rem; color: #184a6e; font-weight: 500; display: inline-flex; align-items: center; gap: 0.3rem; max-width: 220px; }
  .file-chip .remove-file { cursor: pointer; font-weight: 700; color: #5e7e98; transition: color 0.15s; padding: 0 4px; font-size: 0.9rem; }
  .file-chip .remove-file:hover { color: #b13e3e; }

  /* 汇总 */
  .summary-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin: 1.4rem 0 1.6rem; }
  .summary-item { background: #ffffff; border-radius: 1.4rem; padding: 1rem 1.2rem; box-shadow: 0 8px 20px -12px rgba(0, 40, 70, 0.2); border: 1px solid #dbe9f5; }
  .summary-item .label { font-size: 0.82rem; color: #5f7f9a; font-weight: 500; margin-bottom: 0.4rem; }
  .summary-item .value { font-size: 1.6rem; font-weight: 700; color: #0b3d60; }

  /* 面板 */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6rem; margin-bottom: 1.6rem; }
  .stat-panel, .chart-panel { background: #ffffffea; border-radius: 1.8rem; padding: 1.3rem 1.4rem 1.5rem; box-shadow: 0 12px 22px -12px rgba(0, 40, 70, 0.15); border: 1px solid #d3e5f2; }
  .panel-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1rem; border-bottom: 1px solid #cde0ee; padding-bottom: 0.75rem; flex-wrap: wrap; }
  .panel-header h2 { font-size: 1.2rem; font-weight: 600; color: #0d3a5a; }
  .count-badge { background: #d0e3f5; color: #0a314b; border-radius: 30px; padding: 0.15rem 0.8rem; font-size: 0.9rem; font-weight: 600; margin-left: auto; }
  .panel-actions { margin-left: auto; display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .mini-btn { background: #edf5fc; border: 1px solid #c6dced; color: #1d4e74; padding: 0.25rem 0.75rem; border-radius: 30px; font-size: 0.76rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .mini-btn:hover { background: #dcecfb; border-color: #8fb8d8; }
  .mini-btn.active { background: #2b7aac; border-color: #2b7aac; color: #fff; }

  /* 列表 */
  .list-container { max-height: 420px; overflow-y: auto; padding-right: 0.2rem; scrollbar-width: thin; }
  .list-container::-webkit-scrollbar { width: 6px; }
  .list-container::-webkit-scrollbar-track { background: #edf4fa; border-radius: 10px; }
  .list-container::-webkit-scrollbar-thumb { background: #b1cfe7; border-radius: 10px; }
  .stat-item { display: grid; grid-template-columns: 1fr auto 90px; align-items: center; gap: 0.6rem; padding: 0.55rem 0.4rem; border-bottom: 1px solid #edf4fa; font-size: 0.95rem; }
  .stat-item:hover { background: #f4faff; }
  .stat-label { font-weight: 500; color: #12426b; word-break: break-word; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat-value { font-weight: 700; color: #0d314b; background: #e2eefb; padding: 0.2rem 0.75rem; border-radius: 30px; font-size: 0.85rem; text-align: center; min-width: 3.5rem; }
  .stat-bar-wrap { background: #eef5fb; border-radius: 30px; height: 8px; overflow: hidden; }
  .stat-bar { height: 100%; border-radius: 30px; background: linear-gradient(90deg, #79b8e0, #2b7aac); transition: width 0.35s ease; }

  /* 图表 */
  .chart-container { width: 100%; height: 380px; position: relative; display: flex; justify-content: center; align-items: center; }
  .empty-message { color: #809aae; font-style: italic; text-align: center; padding: 2rem 0.5rem; font-size: 0.95rem; }
  .error-message { color: #b13e3e; background: #ffe9e9; padding: 0.8rem 1.2rem; border-radius: 40px; margin-top: 1.2rem; font-size: 0.9rem; border-left: 4px solid #c55252; display: none; }

  /* 底部 */
  .footer-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 1.4rem; flex-wrap: wrap; gap: 0.8rem; }
  .file-info { color: #4f728b; font-size: 0.85rem; font-weight: 500; }
  .footer-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .btn-primary { background: #2b7aac; color: #fff; border: none; padding: 0.45rem 1.2rem; border-radius: 30px; font-size: 0.85rem; font-weight: 500; cursor: pointer; }
  .btn-primary:hover { background: #1f6690; }
  .btn-primary:disabled { background: #b3c8d8; cursor: not-allowed; }
  .reset-btn { background: none; border: 1px solid #b8d0e5; color: #295e84; padding: 0.4rem 1.2rem; border-radius: 30px; font-size: 0.85rem; cursor: pointer; }
  .reset-btn:hover { background: #deedfa; }

  @media (max-width: 720px) { .summary-bar { grid-template-columns: repeat(2, 1fr); } .stats-grid { grid-template-columns: 1fr; } .card { padding: 1.6rem 1.2rem; } h1 { font-size: 1.6rem; } }
</style>
</head>
<body>
<div class="card">
  <h1>📊 CNKI RefWorks 批量分析</h1>
  <div class="subhead">
    <span>按年份统计发文量 · 按刊源统计文章数</span>
    <span class="hint">支持多选 .txt 及 SVG 导出</span>
  </div>

  <!-- 上传区 -->
  <div class="upload-area" id="uploadArea">
    <span class="upload-icon">📤</span>
    <div class="upload-text">点击或拖拽多个文件到此处</div>
    <div class="upload-subtext">支持 CNKI RefWorks 导出的纯文本文件 (.txt)，可多选</div>
    <div id="fileChipsContainer" class="file-list"></div>
    <input type="file" id="fileInput" class="file-input" accept=".txt,text/plain" multiple>
  </div>

  <!-- 汇总 -->
  <div class="summary-bar">
    <div class="summary-item"><div class="label">📄 已解析文件</div><div class="value" id="sumFiles">0</div></div>
    <div class="summary-item"><div class="label">📚 总文章数</div><div class="value" id="sumArticles">0</div></div>
    <div class="summary-item"><div class="label">📅 年份种类</div><div class="value" id="sumYears">0</div></div>
    <div class="summary-item"><div class="label">🏷️ 期刊种类</div><div class="value" id="sumSources">0</div></div>
  </div>

  <!-- 统计面板 -->
  <div class="stats-grid">
    <div class="stat-panel">
      <div class="panel-header">
        <h2>📅 发刊时间</h2>
        <span class="count-badge" id="yearCount">0 个年份</span>
        <div class="panel-actions">
          <button class="mini-btn active" id="yearSortDesc">新→旧</button>
          <button class="mini-btn" id="yearSortAsc">旧→新</button>
        </div>
      </div>
      <div class="list-container" id="yearList"><div class="empty-message">暂无数据，请上传文件</div></div>
    </div>
    <div class="stat-panel">
      <div class="panel-header">
        <h2>📚 发文刊源</h2>
        <span class="count-badge" id="sourceCount">0 个刊源</span>
        <div class="panel-actions">
          <button class="mini-btn active" id="sourceSortCount">按数量</button>
          <button class="mini-btn" id="sourceSortName">按名称</button>
        </div>
      </div>
      <div class="list-container" id="sourceList"><div class="empty-message">暂无数据，请上传文件</div></div>
    </div>
  </div>

  <!-- 图表区 -->
  <div class="chart-panel">
    <div class="panel-header">
      <h2>📈 可视化图表 (纯矢量)</h2>
      <div class="panel-actions">
        <button class="mini-btn active" id="chartDataYear">年份分布</button>
        <button class="mini-btn" id="chartDataSource">期刊分布</button>
        <span style="border-left: 1px solid #cde0ee; margin: 0 0.3rem;"></span>
        <button class="mini-btn active" id="chartTypeBar">柱状图</button>
        <button class="mini-btn" id="chartTypeLine">折线图</button>
        <button class="mini-btn" id="chartTypePie">饼图</button>
        <span style="border-left: 1px solid #cde0ee; margin: 0 0.3rem;"></span>
        <button class="mini-btn" id="exportSvgBtn" style="background:#e2eefb; color:#2b7aac; font-weight:bold;">⬇️ 导出 SVG</button>
      </div>
    </div>
    <div class="chart-container" id="chartContainer">
      <div class="empty-message">暂无数据，请上传文件</div>
    </div>
  </div>

  <div id="errorBox" class="error-message"></div>

  <div class="footer-bar">
    <div class="file-info" id="fileInfoBar"></div>
    <div class="footer-actions">
      <button class="btn-primary" id="exportCsvBtn" disabled>⬇️ 导出 CSV</button>
      <button class="reset-btn" id="resetBtn">⟳ 清空全部</button>
    </div>
  </div>
</div>

<script>
(function () {
  // --- 变量声明 ---
  const uploadArea = document.getElementById('uploadArea');
  const fileInput = document.getElementById('fileInput');
  const fileChipsContainer = document.getElementById('fileChipsContainer');
  const yearListEl = document.getElementById('yearList');
  const sourceListEl = document.getElementById('sourceList');
  const yearCountEl = document.getElementById('yearCount');
  const sourceCountEl = document.getElementById('sourceCount');
  const errorBox = document.getElementById('errorBox');
  const resetBtn = document.getElementById('resetBtn');
  const fileInfoBar = document.getElementById('fileInfoBar');
  const exportCsvBtn = document.getElementById('exportCsvBtn');
  const sumFilesEl = document.getElementById('sumFiles');
  const sumArticlesEl = document.getElementById('sumArticles');
  const sumYearsEl = document.getElementById('sumYears');
  const sumSourcesEl = document.getElementById('sumSources');
  const yearSortAscBtn = document.getElementById('yearSortAsc');
  const yearSortDescBtn = document.getElementById('yearSortDesc');
  const sourceSortCountBtn = document.getElementById('sourceSortCount');
  const sourceSortNameBtn = document.getElementById('sourceSortName');
  
  // 图表按钮
  const chartDataYearBtn = document.getElementById('chartDataYear');
  const chartDataSourceBtn = document.getElementById('chartDataSource');
  const chartTypeBarBtn = document.getElementById('chartTypeBar');
  const chartTypeLineBtn = document.getElementById('chartTypeLine');
  const chartTypePieBtn = document.getElementById('chartTypePie');
  const exportSvgBtn = document.getElementById('exportSvgBtn');

  let currentFiles = [];
  let stats = { years: new Map(), sources: new Map(), articleCount: 0 };
  let yearSortMode = 'desc';
  let sourceSortMode = 'count';
  let chartDataMode = 'year';
  let chartTypeMode = 'bar';

  // --- 工具函数 ---
  function escapeHtml(s) {
    return String(s||'').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
    if (errorBox._timeout) clearTimeout(errorBox._timeout);
    errorBox._timeout = setTimeout(() => { errorBox.style.display = 'none'; }, 6000);
  }
  function hideError() { errorBox.style.display = 'none'; }

  // --- 解析逻辑 ---
  function parseRefWorks(text) {
    const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
    const records = [];
    let current = null;
    for (const rawLine of lines) {
      const line = rawLine.trim(); if (!line) continue;
      const upper = line.toUpperCase();
      if (upper.startsWith('RT ')) {
        if (current) records.push(current);
        current = { year: null, source: null };
        continue;
      }
      if (!current) {
        if (upper.startsWith('JF ') || upper.startsWith('T1 ') || upper.startsWith('YR ') || upper.startsWith('A1 ')) current = { year: null, source: null };
        else continue;
      }
      const m = line.match(/^([A-Z][A-Z0-9])\s+(.*)$/i) || line.match(/^([A-Z][A-Z0-9]):\s*(.*)$/i);
      if (!m) continue;
      const tag = m[1].toUpperCase();
      const value = m[2].trim();
      if (!value) continue;
      if (['JF', 'JO', 'T2', 'JA'].includes(tag) && !current.source) current.source = value;
      if (['YR', 'PY'].includes(tag) && !current.year) {
        const ym = value.match(/\b(19|20)\d{2}\b/);
        if (ym) current.year = ym[0];
      }
      if (tag === 'LK' && !current.year) {
        const ym = value.match(/(19|20)\d{2}/);
        if (ym) current.year = ym[0];
      }
    }
    if (current) records.push(current);
    const years = new Map(), sources = new Map();
    let count = 0;
    for (const r of records) {
      let has = false;
      if (r.year) { years.set(r.year, (years.get(r.year) || 0) + 1); has = true; }
      if (r.source) { sources.set(r.source, (sources.get(r.source) || 0) + 1); has = true; }
      if (has || r) count++;
    }
    return { years, sources, count };
  }

  // --- 渲染 UI ---
  function renderAll() {
    sumFilesEl.textContent = currentFiles.length;
    sumArticlesEl.textContent = stats.articleCount;
    sumYearsEl.textContent = stats.years.size;
    sumSourcesEl.textContent = stats.sources.size;
    fileInfoBar.textContent = currentFiles.length ? `已加载 ${currentFiles.length} 个文件 · 共识别 ${stats.articleCount} 条记录` : '';
    exportCsvBtn.disabled = !(stats.years.size > 0 || stats.sources.size > 0);

    // 年份
    const ye = Array.from(stats.years.entries());
    yearCountEl.textContent = `${ye.length} 个年份`;
    if (!ye.length) yearListEl.innerHTML = '<div class="empty-message">未解析到发刊年份</div>';
    else {
      ye.sort((a, b) => yearSortMode === 'desc' ? b[0].localeCompare(a[0]) : a[0].localeCompare(b[0]));
      const max = Math.max(...ye.map(e => e[1]));
      yearListEl.innerHTML = ye.map(([y, c]) => `
        <div class="stat-item">
          <span class="stat-label">${escapeHtml(y)} 年</span>
          <span class="stat-value">${c} 篇</span>
          <div class="stat-bar-wrap"><div class="stat-bar" style="width:${(c/max*100)}%"></div></div>
        </div>`).join('');
    }

    // 刊源
    const se = Array.from(stats.sources.entries());
    sourceCountEl.textContent = `${se.length} 个刊源`;
    if (!se.length) sourceListEl.innerHTML = '<div class="empty-message">未解析到刊源信息</div>';
    else {
      if (sourceSortMode === 'count') se.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      else se.sort((a, b) => a[0].localeCompare(b[0]));
      const max = Math.max(...se.map(e => e[1]));
      sourceListEl.innerHTML = se.map(([s, c]) => `
        <div class="stat-item">
          <span class="stat-label" title="${escapeHtml(s)}">${escapeHtml(s)}</span>
          <span class="stat-value">${c} 篇</span>
          <div class="stat-bar-wrap"><div class="stat-bar" style="width:${(c/max*100)}%"></div></div>
        </div>`).join('');
    }
    renderChart();
  }

  // --- 渲染 SVG 图表 ---
  function renderChart() {
    let entries = chartDataMode === 'year' ? Array.from(stats.years.entries()) : Array.from(stats.sources.entries());
    if (chartDataMode === 'year') entries.sort((a, b) => a[0].localeCompare(b[0]));
    else { entries.sort((a, b) => b[1] - a[1]); entries = entries.slice(0, 15); }

    const container = document.getElementById('chartContainer');
    if (entries.length === 0) { container.innerHTML = '<div class="empty-message">暂无数据</div>'; return; }

    const w = 900, h = 380, pad = 50;
    const colors = ['#2b7aac', '#79b8e0', '#4fa0d0', '#1f6690', '#a0cbf0', '#559dc7', '#89c1e8', '#398ab5', '#13476a', '#65a9d8'];
    let svg = `<svg id="mySvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;">`;
    svg += `<style>.t{font-family:sans-serif;font-size:13px;fill:#555;} .v{font-weight:bold;font-size:13px;fill:#0b3d60;text-anchor:middle;}</style>`;

    if (chartTypeMode === 'bar' || chartTypeMode === 'line') {
      const max = Math.max(...entries.map(x => x[1]));
      const cw = (w - pad * 2) / entries.length;
      svg += `<line x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}" stroke="#ccc" />`;
      svg += `<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h - pad}" stroke="#ccc" />`;
      const points = [];
      entries.forEach(([label, val], i) => {
        const bh = (val / max) * (h - pad * 2);
        const x = pad + i * cw + cw / 2;
        const y = h - pad - bh;
        let shortLabel = label.length > 7 ? label.slice(0, 7) + '…' : label;
        svg += `<text x="${x}" y="${h - pad + 20}" class="t" text-anchor="middle">${escapeHtml(shortLabel)}</text>`;
        if (chartTypeMode === 'bar') {
          svg += `<rect x="${x - cw * 0.3}" y="${y}" width="${cw * 0.6}" height="${bh}" fill="${colors[i % colors.length]}" rx="4" />`;
          svg += `<text x="${x}" y="${y - 8}" class="v">${val}</text>`;
        } else {
          points.push(`${x},${y}`);
          svg += `<circle cx="${x}" cy="${y}" r="5" fill="#2b7aac" />`;
          svg += `<text x="${x}" y="${y - 12}" class="v">${val}</text>`;
        }
      });
      if (chartTypeMode === 'line' && points.length > 0) {
        svg += `<polyline points="${points.join(' ')}" fill="none" stroke="#2b7aac" stroke-width="3" stroke-linejoin="round" />`;
      }
    } else if (chartTypeMode === 'pie') {
      const total = entries.reduce((s, x) => s + x[1], 0);
      let start = 0;
      const cx = w / 2 - 100, cy = h / 2, r = 130;
      entries.forEach(([label, val], i) => {
        const angle = (val / total) * Math.PI * 2;
        const end = start + angle;
        const x1 = cx + r * Math.sin(start), y1 = cy - r * Math.cos(start);
        const x2 = cx + r * Math.sin(end), y2 = cy - r * Math.cos(end);
        const large = angle > Math.PI ? 1 : 0;
        if (entries.length === 1) svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${colors[i % colors.length]}" />`;
        else svg += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${colors[i % colors.length]}" stroke="#fff" stroke-width="2" />`;
        const ly = 40 + i * 22;
        if (ly < h - 20) {
          svg += `<rect x="${w - 220}" y="${ly - 12}" width="14" height="14" fill="${colors[i % colors.length]}" rx="3" />`;
          let shortLabel = label.length > 12 ? label.slice(0, 12) + '…' : label;
          svg += `<text x="${w - 195}" y="${ly}" class="t">${escapeHtml(shortLabel)} (${val})</text>`;
        }
        start = end;
      });
    }
    svg += `</svg>`;
    container.innerHTML = svg;
  }

  // --- 核心分析 ---
  function analyzeFiles(files) {
    hideError();
    const totalYears = new Map(), totalSources = new Map();
    let totalArticles = 0, errorMsgs = [];
    const tasks = files.map(file => new Promise(resolve => {
      if (file.type !== 'text/plain' && !/\.txt$/i.test(file.name)) { errorMsgs.push(`${file.name}：不是 .txt`); return resolve(); }
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const { years, sources, count } = parseRefWorks(ev.target.result);
          years.forEach((c, y) => totalYears.set(y, (totalYears.get(y) || 0) + c));
          sources.forEach((c, s) => totalSources.set(s, (totalSources.get(s) || 0) + c));
          totalArticles += count;
        } catch (err) { errorMsgs.push(`${file.name}：解析出错`); }
        resolve();
      };
      reader.onerror = () => { errorMsgs.push(`${file.name}：读取失败`); resolve(); };
      reader.readAsText(file, 'UTF-8');
    }));
    Promise.all(tasks).then(() => {
      stats = { years: totalYears, sources: totalSources, articleCount: totalArticles };
      renderAll();
      if (errorMsgs.length) showError(errorMsgs.join('；'));
    });
  }

  // --- 文件操作 ---
  function renderFileChips() {
    if (!currentFiles.length) { fileChipsContainer.innerHTML = ''; return; }
    const show = currentFiles.slice(0, 8);
    let html = show.map((file, i) => {
      const name = file.name.length > 25 ? file.name.slice(0, 22) + '…' : file.name;
      return `<span class="file-chip">📄 ${escapeHtml(name)} <span class="remove-file" data-index="${i}">✕</span></span>`;
    }).join('');
    if (currentFiles.length > 8) html += `<span class="file-chip" style="background:#c1d9ef;">+${currentFiles.length - 8} 个文件</span>`;
    fileChipsContainer.innerHTML = html;
    fileChipsContainer.querySelectorAll('.remove-file').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const idx = parseInt(btn.dataset.index, 10);
        if (!isNaN(idx) && idx < currentFiles.length) {
          currentFiles.splice(idx, 1);
          renderFileChips();
          if (!currentFiles.length) resetStats(); else analyzeFiles(currentFiles);
        }
      });
    });
  }

  function resetStats() {
    stats = { years: new Map(), sources: new Map(), articleCount: 0 };
    renderAll();
  }

  function resetAll() {
    currentFiles = [];
    resetStats();
    fileChipsContainer.innerHTML = '';
    fileInput.value = '';
    hideError();
  }

  function addFiles(fileList) {
    hideError();
    const incoming = Array.from(fileList);
    const txts = incoming.filter(f => f.type === 'text/plain' || /\.txt$/i.test(f.name));
    if (!txts.length) { showError('请上传 .txt 文件'); return; }
    const existing = new Set(currentFiles.map(f => `${f.name}_${f.size}`));
    const added = [];
    for (const f of txts) {
      const key = `${f.name}_${f.size}`;
      if (!existing.has(key)) { existing.add(key); added.push(f); }
    }
    if (!added.length) { showError('所选文件已存在'); return; }
    currentFiles = currentFiles.concat(added);
    renderFileChips();
    analyzeFiles(currentFiles);
  }

  // --- 导出功能 ---
  function exportCsv() {
    const lines = ['类型,名称,数量,占比(%)'];
    const ty = Array.from(stats.years.values()).reduce((a, b) => a + b, 0);
    const ts = Array.from(stats.sources.values()).reduce((a, b) => a + b, 0);
    const ye = Array.from(stats.years.entries()).sort((a, b) => yearSortMode === 'desc' ? b[0].localeCompare(a[0]) : a[0].localeCompare(b[0]));
    for (const [y, c] of ye) lines.push(`年份,${csvEscape(y)},${c},${(c/ty*100).toFixed(2)}`);
    const se = Array.from(stats.sources.entries()).sort((a, b) => sourceSortMode === 'count' ? b[1] - a[1] : a[0].localeCompare(b[0]));
    for (const [s, c] of se) lines.push(`刊源,${csvEscape(s)},${c},${(c/ts*100).toFixed(2)}`);
    const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `CNKI统计.csv`; a.click();
  }
  function csvEscape(v) { const s = String(v==null?'':v); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }

  // --- 事件绑定 ---
  uploadArea.addEventListener('click', e => { if (!e.target.closest('.remove-file')) fileInput.click(); });
  fileInput.addEventListener('change', e => { if (e.target.files.length) addFiles(e.target.files); fileInput.value = ''; });
  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
  uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.classList.remove('drag-over'); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  resetBtn.onclick = resetAll;
  exportCsvBtn.onclick = exportCsv;
  yearSortDescBtn.onclick = () => { yearSortMode = 'desc'; yearSortDescBtn.classList.add('active'); yearSortAscBtn.classList.remove('active'); renderAll(); };
  yearSortAscBtn.onclick = () => { yearSortMode = 'asc'; yearSortAscBtn.classList.add('active'); yearSortDescBtn.classList.remove('active'); renderAll(); };
  sourceSortCountBtn.onclick = () => { sourceSortMode = 'count'; sourceSortCountBtn.classList.add('active'); sourceSortNameBtn.classList.remove('active'); renderAll(); };
  sourceSortNameBtn.onclick = () => { sourceSortMode = 'name'; sourceSortNameBtn.classList.add('active'); sourceSortCountBtn.classList.remove('active'); renderAll(); };

  chartDataYearBtn.onclick = () => { chartDataMode = 'year'; chartDataYearBtn.classList.add('active'); chartDataSourceBtn.classList.remove('active'); renderChart(); };
  chartDataSourceBtn.onclick = () => { chartDataMode = 'source'; chartDataSourceBtn.classList.add('active'); chartDataYearBtn.classList.remove('active'); renderChart(); };
  chartTypeBarBtn.onclick = () => { chartTypeMode = 'bar'; chartTypeBarBtn.classList.add('active'); chartTypeLineBtn.classList.remove('active'); chartTypePieBtn.classList.remove('active'); renderChart(); };
  chartTypeLineBtn.onclick = () => { chartTypeMode = 'line'; chartTypeLineBtn.classList.add('active'); chartTypeBarBtn.classList.remove('active'); chartTypePieBtn.classList.remove('active'); renderChart(); };
  chartTypePieBtn.onclick = () => { chartTypeMode = 'pie'; chartTypePieBtn.classList.add('active'); chartTypeBarBtn.classList.remove('active'); chartTypeLineBtn.classList.remove('active'); renderChart(); };

  exportSvgBtn.onclick = () => {
    const svg = document.getElementById('mySvg');
    if (!svg) return alert('暂无图表');
    const blob = new Blob([new XMLSerializer().serializeToString(svg)], { type: "image/svg+xml;charset=utf-8" });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `CNKI图表_${chartDataMode}_${chartTypeMode}.svg`; a.click();
  };

  resetAll();
})();
</script>
</body>
</html>
