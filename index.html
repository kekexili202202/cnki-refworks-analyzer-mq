<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNKI RefWorks 批量分析 · 年份与刊源统计</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }

  body {
    background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 2rem 1rem;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .card {
    max-width: 1150px;
    width: 100%;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 2.5rem;
    box-shadow: 0 30px 50px -20px rgba(0, 30, 60, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
    padding: 2.2rem 2rem 2.5rem;
    border: 1px solid rgba(255, 255, 255, 0.5);
  }

  h1 {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #0b2b44;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.25rem;
  }

  h1 .emoji-badge { font-size: 2rem; }

  .subhead {
    color: #3a5e7a;
    font-size: 1rem;
    margin-bottom: 1.6rem;
    padding-bottom: 0.75rem;
    border-bottom: 1.5px dashed #cbdbe9;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .subhead .hint {
    background: #d9e6f2;
    padding: 0.2rem 0.9rem;
    border-radius: 40px;
    font-size: 0.8rem;
    color: #1d4b6e;
    font-weight: 500;
  }

  /* 上传区 */
  .upload-area {
    background: #ffffffd9;
    border: 2px dashed #aac7e0;
    border-radius: 2rem;
    padding: 2rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-bottom: 1.4rem;
    box-shadow: 0 6px 12px -8px rgba(0, 50, 80, 0.1);
  }

  .upload-area:hover {
    background: #f4faff;
    border-color: #5d9bce;
  }

  .upload-area.drag-over {
    background: #e2effa;
    border-color: #2b7aac;
    transform: scale(1.01);
  }

  .upload-icon { font-size: 2.8rem; margin-bottom: 0.6rem; display: block; }

  .upload-text { font-weight: 500; color: #1f4a6e; font-size: 1.05rem; margin-bottom: 0.3rem; }

  .upload-subtext { color: #6f8da3; font-size: 0.85rem; }

  .file-input { display: none; }

  .file-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    margin-top: 0.8rem;
  }

  .file-chip {
    background: #d9e9f8;
    padding: 0.25rem 0.9rem;
    border-radius: 30px;
    font-size: 0.8rem;
    color: #184a6e;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    max-width: 220px;
  }

  .file-chip .remove-file {
    cursor: pointer;
    font-weight: 700;
    color: #5e7e98;
    transition: color 0.15s;
    padding: 0 4px;
    font-size: 0.9rem;
  }

  .file-chip .remove-file:hover { color: #b13e3e; }

  /* 汇总卡片 */
  .summary-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    margin: 1.4rem 0 1.6rem;
  }

  @media (max-width: 720px) {
    .summary-bar { grid-template-columns: repeat(2, 1fr); }
  }

  .summary-item {
    background: #ffffff;
    border-radius: 1.4rem;
    padding: 1rem 1.2rem;
    box-shadow: 0 8px 20px -12px rgba(0, 40, 70, 0.2);
    border: 1px solid #dbe9f5;
  }

  .summary-item .label {
    font-size: 0.82rem;
    color: #5f7f9a;
    font-weight: 500;
    margin-bottom: 0.4rem;
  }

  .summary-item .value {
    font-size: 1.6rem;
    font-weight: 700;
    color: #0b3d60;
    letter-spacing: -0.02em;
  }

  /* 面板 */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.6rem;
    margin-bottom: 1.6rem;
  }

  @media (max-width: 720px) {
    .stats-grid { grid-template-columns: 1fr; }
    .card { padding: 1.6rem 1.2rem; border-radius: 2rem; }
    h1 { font-size: 1.6rem; }
  }

  .stat-panel {
    background: #ffffffea;
    border-radius: 1.8rem;
    padding: 1.3rem 1.4rem 1.5rem;
    box-shadow: 0 12px 22px -12px rgba(0, 40, 70, 0.15);
    border: 1px solid #d3e5f2;
  }

  /* 图表专属面板 */
  .chart-panel {
    background: #ffffffea;
    border-radius: 1.8rem;
    padding: 1.3rem 1.4rem 1.5rem;
    box-shadow: 0 12px 22px -12px rgba(0, 40, 70, 0.15);
    border: 1px solid #d3e5f2;
    margin-top: 1.6rem;
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid #cde0ee;
    padding-bottom: 0.75rem;
    flex-wrap: wrap;
  }

  .panel-header h2 {
    font-size: 1.2rem;
    font-weight: 600;
    color: #0d3a5a;
  }

  .panel-actions {
    margin-left: auto;
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
  }

  .mini-btn {
    background: #edf5fc;
    border: 1px solid #c6dced;
    color: #1d4e74;
    padding: 0.25rem 0.75rem;
    border-radius: 30px;
    font-size: 0.76rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  .mini-btn:hover { background: #dcecfb; border-color: #8fb8d8; }

  .mini-btn.active {
    background: #2b7aac;
    border-color: #2b7aac;
    color: #fff;
  }

  /* 统计列表 */
  .list-container {
    max-height: 420px;
    overflow-y: auto;
    padding-right: 0.2rem;
    scrollbar-width: thin;
    scrollbar-color: #b1cfE7 #edf4fa;
  }

  .list-container::-webkit-scrollbar { width: 6px; }
  .list-container::-webkit-scrollbar-track { background: #edf4fa; border-radius: 10px; }
  .list-container::-webkit-scrollbar-thumb { background: #b1cfe7; border-radius: 10px; }

  .stat-item {
    display: grid;
    grid-template-columns: 1fr auto 90px;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 0.4rem;
    border-bottom: 1px solid #edf4fa;
    font-size: 0.95rem;
    border-radius: 8px;
    transition: background 0.1s;
  }

  .stat-item:last-child { border-bottom: none; }
  .stat-item:hover { background: #f4faff; }

  .stat-label {
    font-weight: 500;
    color: #12426b;
    word-break: break-word;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .stat-value {
    font-weight: 700;
    color: #0d314b;
    background: #e2eefb;
    padding: 0.2rem 0.75rem;
    border-radius: 30px;
    font-size: 0.85rem;
    text-align: center;
    min-width: 3.5rem;
  }

  .stat-bar-wrap {
    background: #eef5fb;
    border-radius: 30px;
    height: 8px;
    overflow: hidden;
    position: relative;
  }

  .stat-bar {
    height: 100%;
    border-radius: 30px;
    background: linear-gradient(90deg, #79b8e0, #2b7aac);
    transition: width 0.35s ease;
  }

  .empty-message {
    color: #809aae;
    font-style: italic;
    text-align: center;
    padding: 2rem 0.5rem;
    font-size: 0.95rem;
    background: #f6fbfe;
    border-radius: 40px;
  }

  .error-message {
    color: #b13e3e;
    background: #ffe9e9;
    padding: 0.8rem 1.2rem;
    border-radius: 40px;
    margin-top: 1.2rem;
    font-size: 0.9rem;
    border-left: 4px solid #c55252;
  }

  .reset-btn {
    background: none;
    border: 1px solid #b8d0e5;
    color: #295e84;
    padding: 0.4rem 1.2rem;
    border-radius: 30px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.1s;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }

  .reset-btn:hover { background: #deedfa; border-color: #7fa8c7; color: #0d3858; }

  .footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1.4rem;
    flex-wrap: wrap;
    gap: 0.8rem;
  }

  .file-info {
    color: #4f728b;
    font-size: 0.85rem;
    font-weight: 500;
  }

  .footer-actions {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .btn-primary {
    background: #2b7aac;
    color: #fff;
    border: none;
    padding: 0.45rem 1.2rem;
    border-radius: 30px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }

  .btn-primary:hover { background: #1f6690; }

  .btn-primary:disabled { background: #b3c8d8; cursor: not-allowed; }

  .chart-wrapper {
    position: relative;
    height: 400px;
    width: 100%;
    display: flex;
    justify-content: center;
  }
</style>
</head>
<body>
<div class="card">
  <h1>
    <span class="emoji-badge">📊</span>
    CNKI RefWorks 批量分析
  </h1>
  <div class="subhead">
    <span>按年份统计发文量 · 按刊源统计文章数</span>
    <span class="hint">支持多选 .txt 文件及图表导出</span>
  </div>

  <!-- 上传区域 -->
  <div class="upload-area" id="uploadArea">
    <span class="upload-icon">📤</span>
    <div class="upload-text">点击或拖拽多个文件到此处</div>
    <div class="upload-subtext">支持 CNKI RefWorks 导出的纯文本文件 (.txt)，可多选</div>
    <div id="fileChipsContainer" class="file-list"></div>
    <input type="file" id="fileInput" class="file-input" accept=".txt,text/plain" multiple>
  </div>

  <!-- 汇总卡片 -->
  <div class="summary-bar">
    <div class="summary-item">
      <div class="label">📄 已解析文件</div>
      <div class="value" id="sumFiles">0</div>
    </div>
    <div class="summary-item">
      <div class="label">📚 总文章数</div>
      <div class="value" id="sumArticles">0</div>
    </div>
    <div class="summary-item">
      <div class="label">📅 年份种类</div>
      <div class="value" id="sumYears">0</div>
    </div>
    <div class="summary-item">
      <div class="label">🏷️ 期刊种类</div>
      <div class="value" id="sumSources">0</div>
    </div>
  </div>

  <!-- 统计面板 -->
  <div class="stats-grid">
    <!-- 发刊时间统计 -->
    <div class="stat-panel">
      <div class="panel-header">
        <h2>📅 发刊时间</h2>
        <span class="count-badge" id="yearCount">0 个年份</span>
        <div class="panel-actions">
          <button class="mini-btn active" id="yearSortDesc" type="button">新→旧</button>
          <button class="mini-btn" id="yearSortAsc" type="button">旧→新</button>
        </div>
      </div>
      <div class="list-container" id="yearList">
        <div class="empty-message">暂无数据，请上传文件</div>
      </div>
    </div>

    <!-- 刊源数量统计 -->
    <div class="stat-panel">
      <div class="panel-header">
        <h2>📚 发文刊源</h2>
        <span class="count-badge" id="sourceCount">0 个刊源</span>
        <div class="panel-actions">
          <button class="mini-btn active" id="sourceSortCount" type="button">按数量</button>
          <button class="mini-btn" id="sourceSortName" type="button">按名称</button>
        </div>
      </div>
      <div class="list-container" id="sourceList">
        <div class="empty-message">暂无数据，请上传文件</div>
      </div>
    </div>
  </div>

  <!-- 图表区域 -->
  <div class="chart-panel">
    <div class="panel-header">
      <h2>📈 可视化图表</h2>
      <div class="panel-actions">
        <button class="mini-btn active" id="chartDataYear" type="button">年份分布</button>
        <button class="mini-btn" id="chartDataSource" type="button">期刊分布</button>
        <span style="border-left: 1px solid #cde0ee; margin: 0 0.5rem;"></span>
        <button class="mini-btn active" id="chartTypeBar" type="button">柱状图</button>
        <button class="mini-btn" id="chartTypeLine" type="button">折线图</button>
        <button class="mini-btn" id="chartTypePie" type="button">饼图</button>
        <span style="border-left: 1px solid #cde0ee; margin: 0 0.5rem;"></span>
        <button class="mini-btn" id="exportSvgBtn" type="button">⬇️ 导出 SVG</button>
      </div>
    </div>
    <div class="chart-wrapper">
      <canvas id="myChart"></canvas>
    </div>
  </div>

  <!-- 错误提示 -->
  <div id="errorBox" class="error-message" style="display: none;"></div>

  <!-- 底部 -->
  <div class="footer-bar">
    <div class="file-info" id="fileInfoBar"></div>
    <div class="footer-actions">
      <button class="btn-primary" id="exportCsvBtn" type="button" disabled>⬇️ 导出 CSV 数据</button>
      <button class="reset-btn" id="resetBtn" type="button">⟳ 清空全部</button>
    </div>
  </div>
</div>

<script>
  (function () {
    // ---------- DOM ----------
    const uploadArea         = document.getElementById('uploadArea');
    const fileInput          = document.getElementById('fileInput');
    const fileChipsContainer = document.getElementById('fileChipsContainer');
    const yearListEl         = document.getElementById('yearList');
    const sourceListEl       = document.getElementById('sourceList');
    const yearCountEl        = document.getElementById('yearCount');
    const sourceCountEl      = document.getElementById('sourceCount');
    const errorBox           = document.getElementById('errorBox');
    const resetBtn           = document.getElementById('resetBtn');
    const fileInfoBar        = document.getElementById('fileInfoBar');
    const exportCsvBtn       = document.getElementById('exportCsvBtn');

    const sumFilesEl    = document.getElementById('sumFiles');
    const sumArticlesEl = document.getElementById('sumArticles');
    const sumYearsEl    = document.getElementById('sumYears');
    const sumSourcesEl  = document.getElementById('sumSources');

    const yearSortAscBtn     = document.getElementById('yearSortAsc');
    const yearSortDescBtn    = document.getElementById('yearSortDesc');
    const sourceSortCountBtn = document.getElementById('sourceSortCount');
    const sourceSortNameBtn  = document.getElementById('sourceSortName');

    // 图表相关 DOM
    const chartDataYearBtn = document.getElementById('chartDataYear');
    const chartDataSourceBtn = document.getElementById('chartDataSource');
    const chartTypeBarBtn = document.getElementById('chartTypeBar');
    const chartTypeLineBtn = document.getElementById('chartTypeLine');
    const chartTypePieBtn = document.getElementById('chartTypePie');
    const exportSvgBtn = document.getElementById('exportSvgBtn');
    const ctx = document.getElementById('myChart').getContext('2d');

    // ---------- 状态 ----------
    let currentFiles = [];
    let stats = {
      years: new Map(),
      sources: new Map(),
      articleCount: 0
    };
    let yearSortMode   = 'desc';
    let sourceSortMode = 'count';

    // 图表状态
    let chartDataMode = 'year'; // 'year' | 'source'
    let chartTypeMode = 'bar';  // 'bar' | 'line' | 'pie'
    let myChart = null;

    // 预设好看的图表颜色
    const chartColors = [
      '#2b7aac', '#79b8e0', '#4fa0d0', '#1f6690', '#a0cbf0',
      '#559dc7', '#89c1e8', '#398ab5', '#13476a', '#65a9d8',
      '#b1d4ee', '#206a97', '#4693c1', '#90c8ed', '#2e7b9e'
    ];

    // ---------- 工具 ----------
    function escapeHtml(s) {
      if (!s) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      if (errorBox._timeout) clearTimeout(errorBox._timeout);
      errorBox._timeout = setTimeout(() => {
        errorBox.style.display = 'none';
      }, 6000);
    }

    function hideError() {
      errorBox.style.display = 'none';
      if (errorBox._timeout) {
        clearTimeout(errorBox._timeout);
        errorBox._timeout = null;
      }
    }

    // ---------- RefWorks 解析 ----------
    function parseRefWorks(text) {
      const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
      const records = [];
      let current = null;

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) continue;

        const upper = line.toUpperCase();

        if (upper.startsWith('RT ')) {
          if (current) records.push(current);
          current = { year: null, source: null };
          continue;
        }

        if (!current) {
          if (
            upper.startsWith('JF ') || upper.startsWith('T1 ') ||
            upper.startsWith('YR ') || upper.startsWith('A1 ') || upper.startsWith('SR ')
          ) {
            current = { year: null, source: null };
          } else {
            continue;
          }
        }

        const m =
          line.match(/^([A-Z][A-Z0-9])\s+(.*)$/i) ||
          line.match(/^([A-Z][A-Z0-9]):\s*(.*)$/i) ||
          line.match(/^([A-Z][A-Z0-9])\t(.*)$/i);

        if (!m) continue;

        const tag   = m[1].toUpperCase();
        const value = m[2].trim();
        if (!value) continue;

        if (['JF', 'JO', 'T2', 'JA'].includes(tag) && !current.source) {
          current.source = value;
        }
        if (['YR', 'PY'].includes(tag) && !current.year) {
          const ym = value.match(/\b(19|20)\d{2}\b/);
          if (ym) current.year = ym[0];
          else if (/^\d{4}$/.test(value)) current.year = value;
        }
        if (tag === 'DA' && !current.year) {
          const ym = value.match(/\b(19|20)\d{2}\b/);
          if (ym) current.year = ym[0];
        }
        // 从 LK 网址里抓取年份（例如 20261102）
        if (tag === 'LK' && !current.year) {
          const ym = value.match(/(19|20)\d{2}/);
          if (ym) current.year = ym[0];
        }
      }

      if (current) records.push(current);

      const years   = new Map();
      const sources = new Map();
      let count = 0;

      for (const r of records) {
        let has = false;
        if (r.year) {
          years.set(r.year, (years.get(r.year) || 0) + 1);
          has = true;
        }
        if (r.source) {
          sources.set(r.source, (sources.get(r.source) || 0) + 1);
          has = true;
        }
        // 确保只要有记录，即使无年份无刊源也算入总数
        if (has || r) count++;
      }

      return { years, sources, count };
    }

    // ---------- 渲染列表 ----------
    function renderAll() {
      renderSummary();
      renderYears();
      renderSources();
      renderFileInfo();
      updateChart();

      const hasData = stats.years.size > 0 || stats.sources.size > 0;
      exportCsvBtn.disabled = !hasData;
    }

    function renderSummary() {
      sumFilesEl.textContent    = currentFiles.length;
      sumArticlesEl.textContent = stats.articleCount;
      sumYearsEl.textContent    = stats.years.size;
      sumSourcesEl.textContent  = stats.sources.size;
    }

    function renderFileInfo() {
      if (currentFiles.length === 0) {
        fileInfoBar.textContent = '';
      } else {
        fileInfoBar.textContent =
          `已加载 ${currentFiles.length} 个文件 · 共识别 ${stats.articleCount} 条记录`;
      }
    }

    function renderYears() {
      const entries = Array.from(stats.years.entries());
      yearCountEl.textContent = `${entries.length} 个年份`;

      if (entries.length === 0) {
        yearListEl.innerHTML = '<div class="empty-message">未解析到发刊年份</div>';
        return;
      }

      entries.sort((a, b) =>
        yearSortMode === 'desc'
          ? b[0].localeCompare(a[0])
          : a[0].localeCompare(b[0])
      );

      const max = Math.max(...entries.map(e => e[1]));
      const total = entries.reduce((s, e) => s + e[1], 0);

      yearListEl.innerHTML = entries.map(([year, count]) => {
        const pct = total ? (count / total * 100) : 0;
        const width = max ? (count / max * 100) : 0;
        return `
          <div class="stat-item" title="${escapeHtml(year)} 年：${count} 篇（${pct.toFixed(1)}%）">
            <span class="stat-label">${escapeHtml(year)} 年</span>
            <span class="stat-value">${count} 篇</span>
            <div class="stat-bar-wrap"><div class="stat-bar" style="width:${width}%"></div></div>
          </div>
        `;
      }).join('');
    }

    function renderSources() {
      const entries = Array.from(stats.sources.entries());
      sourceCountEl.textContent = `${entries.length} 个刊源`;

      if (entries.length === 0) {
        sourceListEl.innerHTML = '<div class="empty-message">未解析到刊源信息</div>';
        return;
      }

      if (sourceSortMode === 'count') {
        entries.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      } else {
        entries.sort((a, b) => a[0].localeCompare(b[0]));
      }

      const max = Math.max(...entries.map(e => e[1]));
      const total = entries.reduce((s, e) => s + e[1], 0);

      sourceListEl.innerHTML = entries.map(([source, count]) => {
        const pct = total ? (count / total * 100) : 0;
        const width = max ? (count / max * 100) : 0;
        return `
          <div class="stat-item" title="${escapeHtml(source)}：${count} 篇（${pct.toFixed(1)}%）">
            <span class="stat-label">${escapeHtml(source)}</span>
            <span class="stat-value">${count} 篇</span>
            <div class="stat-bar-wrap"><div class="stat-bar" style="width:${width}%"></div></div>
          </div>
        `;
      }).join('');
    }

    // ---------- 渲染图表 ----------
    function updateChart() {
      let entries = [];
      let labelStr = '';

      if (chartDataMode === 'year') {
        entries = Array.from(stats.years.entries());
        // 年份默认按时间升序展示更符合直觉
        entries.sort((a, b) => a[0].localeCompare(b[0]));
        labelStr = '发文量 (篇)';
      } else {
        entries = Array.from(stats.sources.entries());
        // 期刊只显示前 15 名，避免图表太卡/太乱
        entries.sort((a, b) => b[1] - a[1]);
        entries = entries.slice(0, 15);
        labelStr = '文章数 (篇)';
      }

      const labels = entries.map(e => e[0]);
      const data = entries.map(e => e[1]);

      if (myChart) {
        myChart.destroy();
      }

      if (entries.length === 0) {
        return;
      }

      const isPie = chartTypeMode === 'pie';

      // 准备饼图/柱状图的颜色
      const bgColors = isPie || chartTypeMode === 'bar'
        ? labels.map((_, i) => chartColors[i % chartColors.length])
        : '#2b7aac';

      const chartConfig = {
        type: chartTypeMode,
        data: {
          labels: labels,
          datasets: [{
            label: labelStr,
            data: data,
            backgroundColor: bgColors,
            borderColor: chartTypeMode === 'line' ? '#2b7aac' : '#ffffff',
            borderWidth: chartTypeMode === 'line' ? 2 : 1,
            fill: false,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 500 },
          plugins: {
            legend: {
              display: isPie,
              position: 'right'
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  let label = context.label || '';
                  let value = context.parsed.y !== undefined ? context.parsed.y : context.parsed;
                  return label + ': ' + value + ' 篇';
                }
              }
            }
          },
          scales: isPie ? {} : {
            y: {
              beginAtZero: true,
              ticks: { precision: 0 }
            },
            x: {
              ticks: {
                autoSkip: true,
                maxRotation: 45,
                minRotation: 45,
                callback: function(val, index) {
                  const label = this.getLabelForValue(val);
                  return label.length > 15 ? label.slice(0, 15) + '…' : label;
                }
              }
            }
          }
        }
      };

      myChart = new Chart(ctx, chartConfig);
    }

    // ---------- 导出 SVG ----------
    function exportSvg() {
      if (!myChart) return;
      
      // Chart.js 原生支持导出 base64 图片，但我们需要 SVG 格式
      // 这里我们利用 canvas 将当前图表绘制成 SVG 容器
      try {
        const canvas = document.getElementById('myChart');
        const dataURL = canvas.toDataURL('image/png');
        
        // 构建一个 SVG，内嵌这个 PNG 图片。虽然这不是纯粹的矢量图（文字是位图），
        // 但由于 Canvas 不直接支持导出纯矢量 SVG，这是目前最通用且能在 PPT 里
        // 正常显示的方法。
        // 注：如果你想在 AI 里完全编辑文字，建议直接截图或用 AI 的图表工具重绘。
        const width = canvas.width;
        const height = canvas.height;
        
        const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
          <image href="${dataURL}" width="${width}" height="${height}" />
        </svg>`;

        const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `cnki_chart_${chartDataMode}_${chartTypeMode}.svg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        showError('导出 SVG 失败，请检查浏览器兼容性');
        console.error(err);
      }
    }

    // ---------- 文件芯片 ----------
    function renderFileChips() {
      if (currentFiles.length === 0) {
        fileChipsContainer.innerHTML = '';
        return;
      }
      const maxShow = 8;
      const show = currentFiles.slice(0, maxShow);
      const extra = currentFiles.length - maxShow;

      let html = show.map((file, i) => {
        const name = file.name.length > 25 ? file.name.slice(0, 22) + '…' : file.name;
        return `<span class="file-chip" title="${escapeHtml(file.name)}">
          📄 ${escapeHtml(name)}
          <span class="remove-file" data-index="${i}" title="移除该文件">✕</span>
        </span>`;
      }).join('');

      if (extra > 0) {
        html += `<span class="file-chip" style="background:#c1d9ef;">+${extra} 个文件</span>`;
      }

      fileChipsContainer.innerHTML = html;

      fileChipsContainer.querySelectorAll('.remove-file').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.index, 10);
          if (!isNaN(idx) && idx < currentFiles.length) {
            currentFiles.splice(idx, 1);
            renderFileChips();
            if (currentFiles.length === 0) {
              resetStats();
            } else {
              analyzeFiles(currentFiles);
            }
          }
        });
      });
    }
